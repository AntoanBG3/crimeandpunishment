name: Release

# Builds the three platform executables and attaches them to a draft GitHub
# release. Triggered by pushing a version tag (plain "1.2.0", no "v" prefix,
# matching the existing release history) or manually via workflow_dispatch
# to rehearse the matrix without tagging.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite
        run: python -m unittest discover tests
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          flake8 .
          pylint game_engine

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: crimeandpunishment-linux
            binary: crimeandpunishment-linux
          - os: macos-latest
            name: crimeandpunishment-macos
            binary: crimeandpunishment-macos
          - os: windows-latest
            name: crimeandpunishment-windows
            binary: crimeandpunishment-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Check tag matches GAME_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python -c "
          import os
          from game_engine.game_config import GAME_VERSION
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == GAME_VERSION, f'tag {tag!r} != GAME_VERSION {GAME_VERSION!r}'
          "
      - name: Build executable
        run: python scripts/build_release.py --name ${{ matrix.name }}
      - name: Smoke-test the frozen binary
        env:
          PYTHONUTF8: '1'
        run: python scripts/audit_scenarios.py --scenario console --binary dist/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.name }}-THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
            LICENSE
